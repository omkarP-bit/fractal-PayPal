# Preserve the public scheme/host supplied by a tunnel or reverse proxy so the
# API can derive a valid HTTPS webhook URL when FRACTAL_PUBLIC_URL is unset.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # API proxy to backend (fractal-api on port 8080)
    location /api/ {
        set $api_upstream http://fractal-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_cache_bypass $http_cache_control;
    }

    # PayPal webhooks use the short public path from the onboarding flow.
    location /webhooks/ {
        set $api_upstream http://fractal-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Content-Type $content_type;
    }

    # Internal API proxy (telemetry, policy eval) - also on fractal-api:8080
    location /internal/ {
        set $api_upstream http://fractal-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Authorization $http_authorization;
    }

    # Health check
    location /healthz {
        set $api_upstream http://fractal-api:8080;
        proxy_pass $api_upstream/healthz;
    }

    # The HTML shell must always be revalidated so a new deploy cannot leave
    # browsers running an old JavaScript bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
