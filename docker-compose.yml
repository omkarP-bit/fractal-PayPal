version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  fractal-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - FRACTAL_JWT_SECRET=${FRACTAL_JWT_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_BASE_URL=${PAYPAL_BASE_URL}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID}
      - FRACTAL_ENCRYPTION_KEY=${FRACTAL_ENCRYPTION_KEY:-}
      - FRACTAL_PUBLIC_URL=${FRACTAL_PUBLIC_URL:-}
      - PUBLIC_TUNNEL_URL=${PUBLIC_TUNNEL_URL:-}
      - KIBANA_URL=${KIBANA_URL:-http://localhost:5601}
      - OPA_URL=http://opa:8181
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - MERCHANT_STORE_BASE=http://merchant-store:8090
      - MERCHANT_INTEGRATION_SECRET=${MERCHANT_INTEGRATION_SECRET}
      - FRACTAL_PORT=8080
      - FRACTAL_ANOMALY_ENABLED=${FRACTAL_ANOMALY_ENABLED:-false}
      - FRACTAL_INCIDENT_MIN_CASES=${FRACTAL_INCIDENT_MIN_CASES:-2}
      - FRACTAL_INCIDENT_WINDOW=${FRACTAL_INCIDENT_WINDOW:-6h}
      - FRACTAL_ASSISTANT_AUTOSEND=${FRACTAL_ASSISTANT_AUTOSEND:-false}
      - INVESTIGATOR_URL=http://investigator:8100
      - INVESTIGATOR_TOKEN=${INVESTIGATOR_TOKEN:-dev-investigator-token}
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      investigator:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  investigator:
    build:
      context: ./investigator
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - FRACTAL_API_BASE=http://fractal-api:8080
      - INVESTIGATOR_TOKEN=${INVESTIGATOR_TOKEN:-dev-investigator-token}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}

  merchant-store:
    build:
      context: ./merchant-store
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - MERCHANT_ID=${MERCHANT_ID:-00000000-0000-0000-0000-0000000000c1}
      - MERCHANT_INTEGRATION_SECRET=${MERCHANT_INTEGRATION_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_BASE_URL=${PAYPAL_BASE_URL}
      - FRACTAL_API_BASE=http://fractal-api:8080
      - MERCHANT_PUBLIC_URL=${MERCHANT_PUBLIC_URL:-http://localhost:8090}
      - MERCHANT_STORE_PATH=/data/orders.json
      - MERCHANT_PORT=8090
    volumes:
      - merchant-data:/data
    depends_on:
      - fractal-api

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://fractal-api:8080
    depends_on:
      - fractal-api

volumes:
  pgdata:
  esdata:
  merchant-data:
