# Render Blueprint for FRACTAL.
#
# One-time setup: push this repository to GitHub, then in Render choose
# "New > Blueprint" and point it at the repo. Render creates the database and
# the four services below. Values marked sync: false are entered once in the
# dashboard (see docs/DEPLOY_RENDER.md).
#
# The API image contains an embedded OPA policy engine, so no separate policy
# service is needed. Public origins come from RENDER_EXTERNAL_URL instead of a
# cloudflared tunnel.

envVarGroups:
  # PayPal credentials are shared by the API (webhook capture, verification)
  # and the demo merchant store (order creation).
  - name: fractal-paypal
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MERCHANT_INTEGRATION_SECRET
        generateValue: true

  # Shared token that protects the investigator service and the API's
  # read-only internal tools.
  - name: fractal-investigator
    envVars:
      - key: INVESTIGATOR_TOKEN
        generateValue: true

databases:
  - name: fractal-postgres
    databaseName: fractal
    user: fractal
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    # Private network only. Remove this if you need to connect from a laptop.
    ipAllowList: []

services:
  - type: web
    name: fractal-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: fractal-paypal
      - fromGroup: fractal-investigator
      - key: DATABASE_URL
        fromDatabase:
          name: fractal-postgres
          property: connectionString
      # Stable public HTTPS origin. This replaces the temporary tunnel URL for
      # PayPal webhook registration and return URLs.
      - key: FRACTAL_PUBLIC_URL
        fromService:
          name: fractal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # The seeded-user shortcut is off on public deployments. Imported demo
      # users get a password with cmd/setpassword (see the deploy guide).
      - key: FRACTAL_DEV_LOGIN_ENABLED
        value: "false"
      - key: FRACTAL_JWT_SECRET
        generateValue: true
      - key: FRACTAL_ENCRYPTION_KEY
        generateValue: true
      - key: FRACTAL_ANOMALY_ENABLED
        value: "false"
      - key: MERCHANT_STORE_BASE
        fromService:
          name: fractal-store
          type: web
          property: hostport
      - key: INVESTIGATOR_URL
        fromService:
          name: fractal-investigator
          type: web
          property: hostport

  - type: web
    name: fractal-store
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./merchant-store/Dockerfile
    dockerContext: ./merchant-store
    healthCheckPath: /
    envVars:
      - fromGroup: fractal-paypal
      - key: MERCHANT_ID
        value: dd360069-ca76-431b-94e5-277c47dcfffc
      - key: MERCHANT_PUBLIC_URL
        fromService:
          name: fractal-store
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRACTAL_API_BASE
        fromService:
          name: fractal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Free instances have no persistent disk. Orders survive a restart only
      # on a paid instance with a disk mounted at /data (see the deploy guide).
      - key: MERCHANT_STORE_PATH
        value: /app/orders.json

  - type: web
    name: fractal-investigator
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./investigator/Dockerfile
    dockerContext: ./investigator
    healthCheckPath: /healthz
    envVars:
      - fromGroup: fractal-investigator
      - key: FRACTAL_API_BASE
        fromService:
          name: fractal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # Vite builds a static bundle. VITE_API_BASE resolves to the API's stable
  # public origin at build time.
  - type: web
    name: fractal-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: fractal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
